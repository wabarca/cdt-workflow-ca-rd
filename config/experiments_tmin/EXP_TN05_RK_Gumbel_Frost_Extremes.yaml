# ==============================================================================
# EXPERIMENTO EXP-TN05: Heladas Agronómicas y Extremos Bajo Cero (RK + Gumbel Mínimos)
# ==============================================================================
# Justificación Física y Climatológica Regional:
# Modela eventos de temperaturas mínimas extremas (<0 °C) en altiplanos y cumbres montañosas.
# ==============================================================================

include: "config/global_config.yaml"

experiment_id: "EXP_TN05_RK_Gumbel_Frost_Extremes"
variable_type: "tmin"
var_id: "temp"
description: "Heladas Agronómicas y Extremos Bajo Cero: RK con QM Gumbel para colas frías (<P05)"

downscaling:
  method: "blin"

bias_correction:
  method: "qmdist"
  distribution: "gumbel"
  interpolation:
    method: "okr"
    maxdist: 3.5
    nmin: 4
    nmax: 12
    use_block: true
    variogram_models: ["Sph", "Exp", "Gau", "Pen"]

merging:
  method: "RK"
  nrun: 3
  passes: [1.0, 0.75, 0.50]
  covariables: ["dem", "lat", "lon"]
  interpolation:
    method: "okr"
    maxdist: 3.5
    nmin: 4
    nmax: 12
    use_block: true
    variogram_models: ["Sph", "Exp", "Gau", "Pen"]
