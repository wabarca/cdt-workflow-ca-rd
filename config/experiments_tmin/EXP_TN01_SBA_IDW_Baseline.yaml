# ==============================================================================
# EXPERIMENTO EXP-TN01: Control Nulo Nocturno (SBA + IDW)
# ==============================================================================
# Menú CDT: Merging Data > Temperatures > Compute Coef / Downscale / Bias / Apply / Merging
# Justificación Física y Climatológica Regional:
# Mide el sesgo nocturno base al ignorar el enfriamiento radiativo y el drenaje de aire frío.
# ==============================================================================

include: "config/global_config.yaml"

experiment_id: "EXP_TN01_SBA_IDW_Baseline"
variable_type: "tmin"
var_id: "temp"
description: "Control Nulo Nocturno: SBA monocapa IDW sin enfriamiento radiativo ni DEM"

downscaling:
  method: "blin"

bias_correction:
  method: "mbvar"
  interpolation:
    method: "idw"
    maxdist: 3.5
    nmin: 4
    nmax: 12

merging:
  method: "SBA"
  nrun: 1
  passes: [1.0]
  interpolation:
    method: "idw"
    maxdist: 3.5
    nmin: 4
    nmax: 12
