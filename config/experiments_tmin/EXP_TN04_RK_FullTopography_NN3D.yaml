# ==============================================================================
# EXPERIMENTO EXP-TN04: Inversiones Térmicas Nocturnas (Cold-Air Pooling + NN-3D)
# ==============================================================================
# Justificación Física y Climatológica Regional:
# Evita contaminación térmica entre cimas cálidas y valles fríos (Constanza, Valle Nuevo, Quetzaltenango).
# ==============================================================================

include: "config/global_config.yaml"

experiment_id: "EXP_TN04_RK_FullTopography_NN3D"
variable_type: "tmin"
var_id: "temp"
description: "Inversiones Térmicas Nocturnas (Cold-Air Pooling): RK con aislamiento vertical estricto NN-3D"

downscaling:
  method: "blin"

bias_correction:
  method: "mbvar"
  interpolation:
    method: "nn3d"
    maxdist: 3.5
    nmin: 4
    nmax: 12

merging:
  method: "RK"
  nrun: 3
  passes: [1.0, 0.75, 0.50]
  covariables: ["dem", "slope", "lat", "lon"]
  interpolation:
    method: "okr"
    maxdist: 3.5
    nmin: 4
    nmax: 12
    use_block: true
    variogram_models: ["Sph", "Exp", "Gau", "Pen"]
