# ==============================================================================
# EXPERIMENTO EXP-TN02: Gradiente Térmico Nocturno Ambiental (RK + DEM + Normal)
# ==============================================================================
# Justificación Física y Climatológica Regional:
# Modela la tasa vertical nocturna estándar en zonas abiertas sin inversión térmica marcada.
# ==============================================================================

include: "config/global_config.yaml"

experiment_id: "EXP_TN02_RK_DEM_Normal"
variable_type: "tmin"
var_id: "temp"
description: "Gradiente Térmico Nocturno Ambiental: RK con elevación DEM y QM Normal"

downscaling:
  method: "blin"

bias_correction:
  method: "qmdist"
  distribution: "norm"
  interpolation:
    method: "idw"
    maxdist: 3.5
    nmin: 4
    nmax: 12

merging:
  method: "RK"
  nrun: 3
  passes: [1.0, 0.75, 0.50]
  covariables: ["dem"]
  interpolation:
    method: "okr"
    maxdist: 3.5
    nmin: 4
    nmax: 12
    use_block: true
    variogram_models: ["Sph", "Exp", "Gau", "Pen"]
