# ==============================================================================
# EXPERIMENTO TN02: GRADIENTE ADIABÁTICO NOCTURNO (RK SOLO DEM + QM NORMAL)
# Dominio: Centroamérica y República Dominicana (1991–2020)
# Variable: Temperatura Mínima Diaria (CHIRTS Tmin + Estaciones)
# ==============================================================================
include: "config/global_config.yaml"

experiment_id: "EXP_TN02"
name: "Gradiente Nocturno Libre Tmin (RK Solo DEM + QM Normal)"
description: >
  Modela el enfriamiento altimétrico nocturno libre (Lapse Rate dT/dz ~ -6.5 °C/km)
  en cumbres montañosas (>3,000 m, Pico Duarte, Tajumulco, Chirripó) con QM Normal.

variable_type: "tmin"
var_id: "tmin"

downscaling:
  method: "bilinear"
  interp_method: "blin"

bias_correction:
  method: "qmdist"
  distr: "norm"
  interp_method: "idw"
  params:
    idw_power: 2.0
    nmin: 4
    nmax: 12
    maxdist: 3.5

merging:
  method: "regr.kriging"
  covariables:
    - "dem"
  passes:
    - radius: 1.0
      interp_method: "regr.kriging"
      vgm_model: "Sph"
    - radius: 0.75
      interp_method: "regr.kriging"
      vgm_model: "Sph"
    - radius: 0.50
      interp_method: "regr.kriging"
      vgm_model: "Exp"
