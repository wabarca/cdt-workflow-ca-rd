# ==============================================================================
# EXPERIMENTO EXP-TN06: Amortiguamiento Marino y Llanuras Homogéneas (Barnes BSc)
# ==============================================================================
# Justificación Física y Climatológica Regional:
# Representa el efecto regulador térmico del océano en costas caribeñas y valles aluviales amplios.
# ==============================================================================

include: "config/global_config.yaml"

experiment_id: "EXP_TN06_Barnes_Gauss_Coastal"
variable_type: "tmin"
var_id: "temp"
description: "Amortiguamiento Marino y Llanuras Homogéneas: Análisis Objetivo de Barnes continuo"

downscaling:
  method: "blin"

bias_correction:
  method: "mbvar"
  interpolation:
    method: "idw"
    maxdist: 3.5
    nmin: 4
    nmax: 12

merging:
  method: "SBA"
  nrun: 3
  passes: [1.0, 0.75, 0.50]
  interpolation:
    method: "barnes"
    maxdist: 3.5
    nmin: 4
    nmax: 12
