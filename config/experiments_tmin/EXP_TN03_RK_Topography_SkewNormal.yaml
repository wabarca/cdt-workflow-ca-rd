# ==============================================================================
# EXPERIMENTO EXP-TN03: Invasiones de Frentes Fríos Invernales (RK + Skew-Normal)
# ==============================================================================
# Justificación Física y Climatológica Regional:
# Captura las caídas abruptas y asimétricas de temperatura en la vertiente Atlántica (Nortes).
# ==============================================================================

include: "config/global_config.yaml"

experiment_id: "EXP_TN03_RK_Topography_SkewNormal"
variable_type: "tmin"
var_id: "temp"
description: "Invasiones de Frentes Fríos Invernales: RK con DEM, Pendiente, Coordenadas y Skew-Normal"

downscaling:
  method: "idw"

bias_correction:
  method: "qmdist"
  distribution: "snorm"
  interpolation:
    method: "idw"
    maxdist: 3.5
    nmin: 4
    nmax: 12

merging:
  method: "RK"
  nrun: 3
  passes: [1.0, 0.75, 0.50]
  covariables: ["dem", "slope", "lat", "lon"]
  interpolation:
    method: "okr"
    maxdist: 3.5
    nmin: 4
    nmax: 12
    use_block: true
    variogram_models: ["Sph", "Exp", "Gau", "Pen"]
