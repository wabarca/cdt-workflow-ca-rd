# ==============================================================================
# EXPERIMENTO EXP-TN07: Pozas de Aire Frío Confinadas (Cressman CSc + mbmon)
# ==============================================================================
# Justificación Física y Climatológica Regional:
# Radios decrecientes para evitar disipar el aire frío estancado en depresiones hacia cordilleras.
# ==============================================================================

include: "config/global_config.yaml"

experiment_id: "EXP_TN07_Cressman_ColdAirPooling"
variable_type: "tmin"
var_id: "temp"
description: "Pozas de Aire Frío Confinadas: Cressman con radios decrecientes para atrapar aire denso"

downscaling:
  method: "blin"

bias_correction:
  method: "mbmon"
  interpolation:
    method: "idw"
    maxdist: 3.5
    nmin: 4
    nmax: 12

merging:
  method: "SBA"
  nrun: 4
  passes: [1.0, 0.75, 0.50, 0.25]
  interpolation:
    method: "cressman"
    maxdist: 3.5
    nmin: 4
    nmax: 12
