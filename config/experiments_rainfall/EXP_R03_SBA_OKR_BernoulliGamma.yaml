# ==============================================================================
# EXPERIMENTO EXP-R03: Régimen Convectivo Tropical Típico (Bernoulli-Gamma + OKR)
# ==============================================================================
# Justificación Física y Climatológica Regional:
# La distribución Gamma modela la asimetría de lluvias convectivas moderadas;
# el Kriging por bloques corrige el error de soporte espacial (estación vs grilla 5.5 km).
# ==============================================================================

include: "config/global_config.yaml"

experiment_id: "EXP_R03_SBA_OKR_BernoulliGamma"
variable_type: "rainfall"
description: "Régimen Convectivo Tropical Típico: QM Bernoulli-Gamma con Kriging Ordinario por Bloques"

bias_correction:
  method: "qmdist"
  distribution: "berngamma"
  interpolation:
    method: "okr"
    use_block: true
    maxdist: 2.0
    nmin: 4
    nmax: 12
    variogram_models: ["Sph", "Exp", "Gau"]

rnor_mask:
  use: true
  wet_threshold: 1.0
  smoothing: true
  method: "logit"

merging:
  method: "SBA"
  nrun: 3
  passes: [1.0, 0.75, 0.50]
  interpolation:
    method: "okr"
    maxdist: 2.0
    nmin: 4
    nmax: 12
    use_block: true
    variogram_models: ["Sph", "Exp", "Gau"]
