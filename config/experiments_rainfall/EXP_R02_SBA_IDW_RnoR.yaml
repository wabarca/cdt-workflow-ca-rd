# ==============================================================================
# EXPERIMENTO EXP-R02: Impacto del Filtro RnoR en Zonas Semiáridas (SBA + IDW + RnoR)
# ==============================================================================
# Justificación Física y Climatológica Regional:
# Evalúa la restauración de rachas secas reales durante la Canícula (Mid-Summer Drought)
# en el Corredor Seco y Azua, eliminando falsa lluvia satelital.
# ==============================================================================

include: "config/global_config.yaml"

experiment_id: "EXP_R02_SBA_IDW_RnoR"
variable_type: "rainfall"
description: "Impacto del Filtro RnoR en Zonas Semiáridas: SBA multiescala con RnoR activada"

bias_correction:
  method: "mbvar"
  interpolation:
    method: "idw"
    maxdist: 1.5
    nmin: 4
    nmax: 12

rnor_mask:
  use: true
  wet_threshold: 1.0
  smoothing: true
  method: "logit"

merging:
  method: "SBA"
  nrun: 3
  passes: [1.0, 0.75, 0.50]
  interpolation:
    method: "idw"
    maxdist: 1.5
    nmin: 4
    nmax: 12
    use_block: false
