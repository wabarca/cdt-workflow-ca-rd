# ==============================================================================
# EXPERIMENTO EXP-R04: Extremos Ciclónicos y Tormentas Severas (Bernoulli-Weibull + OKR)
# ==============================================================================
# Justificación Física y Climatológica Regional:
# La función Weibull captura las colas pesadas (>150 mm/día) provocadas por ondas del este,
# ciclones en el Caribe y giros monzónicos centroamericanos (CAG).
# ==============================================================================

include: "config/global_config.yaml"

experiment_id: "EXP_R04_SBA_OKR_BernoulliWeibull"
variable_type: "rainfall"
description: "Extremos Ciclónicos y Tormentas Severas: QM Bernoulli-Weibull con Kriging Ordinario por Bloques"

bias_correction:
  method: "qmdist"
  distribution: "bernweibull"
  interpolation:
    method: "okr"
    use_block: true
    maxdist: 2.0
    nmin: 4
    nmax: 12
    variogram_models: ["Sph", "Exp", "Gau"]

rnor_mask:
  use: true
  wet_threshold: 1.0
  smoothing: true
  method: "logit"

merging:
  method: "SBA"
  nrun: 3
  passes: [1.0, 0.75, 0.50]
  interpolation:
    method: "okr"
    maxdist: 2.0
    nmin: 4
    nmax: 12
    use_block: true
    variogram_models: ["Sph", "Exp", "Gau"]
