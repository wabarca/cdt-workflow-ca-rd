# ==============================================================================
# EXPERIMENTO EXP-R01: Control Nulo / Línea Base Plana (SBA + IDW)
# ==============================================================================
# Menú CDT: Merging Data > Rainfall > Compute Bias / Apply Bias / Merging Data
# Justificación Física y Climatológica Regional:
# Control Nulo Determinista (Línea Base): Mide la discrepancia satelital pura sin
# control de lloviznas espurias (drizzle effect) ni esquemas multiescala.
# ==============================================================================

include: "config/global_config.yaml"

experiment_id: "EXP_R01_SBA_IDW_Baseline"
variable_type: "rainfall"
description: "Control Nulo Determinista: SBA 1 pasada con IDW plano y sin máscara RnoR"

bias_correction:
  method: "mbvar"
  interpolation:
    method: "idw"
    maxdist: 1.5
    nmin: 4
    nmax: 12

rnor_mask:
  use: false

merging:
  method: "SBA"
  nrun: 1
  passes: [1.0]
  interpolation:
    method: "idw"
    maxdist: 1.5
    nmin: 4
    nmax: 12
    use_block: false
