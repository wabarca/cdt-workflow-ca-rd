# ==============================================================================
# EXPERIMENTO TX05: OLAS DE CALOR Y EXTREMOS TÉRMICOS DIURNOS (GUMBEL)
# Dominio: Centroamérica y República Dominicana (1991–2020)
# Variable: Temperatura Máxima Diaria (CHIRTS Tmax + Estaciones)
# ==============================================================================
include: "config/global_config.yaml"

experiment_id: "EXP_TX05"
name: "Olas de Calor y Extremos Tmax (Gumbel P95/P99 + RK Depresiones)"
description: >
  Ajusta valores extremos de temperatura máxima diurna en depresiones áridas
  y valles encajonados (Valle de Azua, Hoya de Enriquillo a -40 msnm, Golfo de Fonseca >38 °C)
  utilizando la distribución de valores extremos de Gumbel.

variable_type: "tmax"
var_id: "tmax"

downscaling:
  method: "bilinear"
  interp_method: "blin"

bias_correction:
  method: "qmdist"
  distr: "gumbel"
  interp_method: "okr"
  params:
    vgm_model: "Sph"
    nmin: 4
    nmax: 12
    maxdist: 3.5

merging:
  method: "regr.kriging"
  covariables:
    - "dem"
    - "lat"
    - "lon"
  passes:
    - radius: 1.0
      interp_method: "regr.kriging"
      vgm_model: "Sph"
    - radius: 0.75
      interp_method: "regr.kriging"
      vgm_model: "Sph"
    - radius: 0.50
      interp_method: "regr.kriging"
      vgm_model: "Exp"
