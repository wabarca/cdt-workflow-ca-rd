# ==============================================================================
# EXPERIMENTO EXP-TX05: Olas de Calor en Depresiones Áridas (RK + Gumbel Máximos)
# ==============================================================================
# Justificación Física y Climatológica Regional:
# Ajusta picos térmicos extremos (>38 °C a 40 °C) en Hoya de Enriquillo, Valle de Azua y Golfo de Fonseca.
# ==============================================================================

include: "config/global_config.yaml"

experiment_id: "EXP_TX05_RK_Gumbel_Heatwaves"
variable_type: "tmax"
var_id: "temp"
description: "Olas de Calor en Depresiones Áridas: RK con QM Gumbel para extremos superiores"

downscaling:
  method: "blin"

bias_correction:
  method: "qmdist"
  distribution: "gumbel"
  interpolation:
    method: "okr"
    maxdist: 3.5
    nmin: 4
    nmax: 12
    use_block: true
    variogram_models: ["Sph", "Exp", "Gau", "Pen"]

merging:
  method: "RK"
  nrun: 3
  passes: [1.0, 0.75, 0.50]
  covariables: ["dem", "lat", "lon"]
  interpolation:
    method: "okr"
    maxdist: 3.5
    nmin: 4
    nmax: 12
    use_block: true
    variogram_models: ["Sph", "Exp", "Gau", "Pen"]
