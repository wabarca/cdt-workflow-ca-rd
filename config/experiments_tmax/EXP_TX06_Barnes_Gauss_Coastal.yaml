# ==============================================================================
# EXPERIMENTO EXP-TX06: Llanuras y Brisas Costeras Diurnas (Barnes BSc)
# ==============================================================================
# Justificación Física y Climatológica Regional:
# Transición espacial continua sin saltos abruptos a lo largo de llanuras litorales y planicies.
# ==============================================================================

include: "config/global_config.yaml"

experiment_id: "EXP_TX06_Barnes_Gauss_Coastal"
variable_type: "tmax"
var_id: "temp"
description: "Llanuras y Brisas Costeras Diurnas: Análisis Objetivo de Barnes continuo"

downscaling:
  method: "blin"

bias_correction:
  method: "mbvar"
  interpolation:
    method: "idw"
    maxdist: 3.5
    nmin: 4
    nmax: 12

merging:
  method: "SBA"
  nrun: 3
  passes: [1.0, 0.75, 0.50]
  interpolation:
    method: "barnes"
    maxdist: 3.5
    nmin: 4
    nmax: 12
