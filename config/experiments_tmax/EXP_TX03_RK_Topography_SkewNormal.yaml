# ==============================================================================
# EXPERIMENTO TX03: ASIMETRÍA DIURNA Y TOPOGRAFÍA COMPLEJA (SKEW-NORMAL)
# Dominio: Centroamérica y República Dominicana (1991–2020)
# Variable: Temperatura Máxima Diaria (CHIRTS Tmax + Estaciones)
# ==============================================================================
include: "config/global_config.yaml"

experiment_id: "EXP_TX03"
name: "Asimetría Térmica Diurna Tmax (Skew-Normal + RK Topografía)"
description: >
  Modela distribuciones asimétricas de temperatura máxima debidas al desarrollo
  convectivo vespertino y bloqueos de nubosidad orográfica.

variable_type: "tmax"
var_id: "tmax"

downscaling:
  method: "idw"
  interp_method: "idw"
  params:
    idw_power: 2.0
    nmin: 4
    nmax: 12
    maxdist: 2.5

bias_correction:
  method: "qmdist"
  distr: "snorm"
  interp_method: "okr"
  params:
    vgm_model: "Sph"
    nmin: 4
    nmax: 12
    maxdist: 3.5

merging:
  method: "regr.kriging"
  covariables:
    - "dem"
    - "slope"
    - "lat"
    - "lon"
  passes:
    - radius: 1.0
      interp_method: "regr.kriging"
      vgm_model: "Sph"
    - radius: 0.75
      interp_method: "regr.kriging"
      vgm_model: "Sph"
    - radius: 0.50
      interp_method: "regr.kriging"
      vgm_model: "Exp"
