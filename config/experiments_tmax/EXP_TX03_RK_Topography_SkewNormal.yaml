# ==============================================================================
# EXPERIMENTO EXP-TX03: Asimetría Térmica por Laderas y Frentes Fríos (RK + Skew-Normal)
# ==============================================================================
# Justificación Física y Climatológica Regional:
# Captura la asimetría diurna inducida por inclinación del terreno y descensos térmicos por Nortes.
# ==============================================================================

include: "config/global_config.yaml"

experiment_id: "EXP_TX03_RK_Topography_SkewNormal"
variable_type: "tmax"
var_id: "temp"
description: "Asimetría Térmica por Laderas y Nortes: RK con DEM, Pendiente, Coordenadas y Skew-Normal"

downscaling:
  method: "idw"

bias_correction:
  method: "qmdist"
  distribution: "snorm"
  interpolation:
    method: "okr"
    maxdist: 3.5
    nmin: 4
    nmax: 12
    use_block: true
    variogram_models: ["Sph", "Exp", "Gau", "Pen"]

merging:
  method: "RK"
  nrun: 3
  passes: [1.0, 0.75, 0.50]
  covariables: ["dem", "slope", "lat", "lon"]
  interpolation:
    method: "okr"
    maxdist: 3.5
    nmin: 4
    nmax: 12
    use_block: true
    variogram_models: ["Sph", "Exp", "Gau", "Pen"]
