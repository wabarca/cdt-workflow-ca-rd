# ==============================================================================
# EXPERIMENTO EXP-TX07: Valles Intermontanos Confinados (Cressman CSc + mbmon)
# ==============================================================================
# Justificación Física y Climatológica Regional:
# Envolventes decrecientes para evitar que estaciones cálidas de valles contaminen laderas altas vecinas.
# ==============================================================================

include: "config/global_config.yaml"

experiment_id: "EXP_TX07_Cressman_Intermontane"
variable_type: "tmax"
var_id: "temp"
description: "Valles Intermontanos Confinados: Cressman con radios decrecientes y sesgo mensual"

downscaling:
  method: "blin"

bias_correction:
  method: "mbmon"
  interpolation:
    method: "idw"
    maxdist: 3.5
    nmin: 4
    nmax: 12

merging:
  method: "SBA"
  nrun: 4
  passes: [1.0, 0.75, 0.50, 0.25]
  interpolation:
    method: "cressman"
    maxdist: 3.5
    nmin: 4
    nmax: 12
