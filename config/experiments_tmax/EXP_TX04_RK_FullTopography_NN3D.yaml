# ==============================================================================
# EXPERIMENTO EXP-TX04: Insolación Diurna según Orientación (RK + DEM + Aspect + NN-3D)
# ==============================================================================
# Justificación Física y Climatológica Regional:
# Laderas orientadas al este reciben calentamiento matutino; laderas al oeste acumulan el vespertino.
# ==============================================================================

include: "config/global_config.yaml"

experiment_id: "EXP_TX04_RK_FullTopography_NN3D"
variable_type: "tmax"
var_id: "temp"
description: "Insolación Diurna según Orientación: RK con DEM, Pendiente, Aspect y ajuste NN-3D"

downscaling:
  method: "blin"

bias_correction:
  method: "mbvar"
  interpolation:
    method: "shepard"
    maxdist: 3.5
    nmin: 4
    nmax: 12

merging:
  method: "RK"
  nrun: 3
  passes: [1.0, 0.75, 0.50]
  covariables: ["dem", "slope", "aspect"]
  interpolation:
    method: "okr"
    maxdist: 3.5
    nmin: 4
    nmax: 12
    use_block: true
    variogram_models: ["Sph", "Exp", "Gau", "Pen"]
