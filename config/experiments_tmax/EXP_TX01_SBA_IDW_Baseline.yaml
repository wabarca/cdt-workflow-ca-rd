# ==============================================================================
# EXPERIMENTO EXP-TX01: Control Nulo Térmico Diurno (SBA + IDW)
# ==============================================================================
# Menú CDT: Merging Data > Temperatures > Compute Coef / Downscale / Bias / Apply / Merging
# Justificación Física y Climatológica Regional:
# Cuantifica el error sistemático al ignorar el relieve y la insolación solar diurna.
# ==============================================================================

include: "config/global_config.yaml"

experiment_id: "EXP_TX01_SBA_IDW_Baseline"
variable_type: "tmax"
var_id: "temp"
description: "Control Nulo Térmico Diurno: SBA monocapa IDW sin covariables topográficas"

downscaling:
  method: "blin"

bias_correction:
  method: "mbvar"
  interpolation:
    method: "idw"
    maxdist: 3.5
    nmin: 4
    nmax: 12

merging:
  method: "SBA"
  nrun: 1
  passes: [1.0]
  interpolation:
    method: "idw"
    maxdist: 3.5
    nmin: 4
    nmax: 12
