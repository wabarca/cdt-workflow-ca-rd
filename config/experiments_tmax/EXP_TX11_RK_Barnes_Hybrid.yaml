# ==============================================================================
# EXPERIMENTO EXP-TX11: Híbrido Determinista-Gaussiano (RK + Barnes) (FASE 2)
# ==============================================================================
# Justificación Física y Climatológica Regional (Fase 2):
# Descompone el campo diurno en una tendencia orográfica gobernada por DEM
# y coordenadas geográficas, filtrando los residuos espaciales con el análisis
# objetivo de Barnes para producir isotermas continuas suaves sin discontinuidades
# artificiales a lo largo de litorales costeros y vertientes.
# ==============================================================================

include: "config/global_config.yaml"

experiment_id: "EXP_TX11_RK_Barnes_Hybrid"
variable_type: "tmax"
var_id: "temp"
description: "Fase 2: Regression Kriging con tendencia DEM/Coords y análisis objetivo de Barnes en residuos"

downscaling:
  method: "blin"

bias_correction:
  method: "mbvar"
  interpolation:
    method: "idw"
    maxdist: 3.5
    nmin: 4
    nmax: 12

merging:
  method: "RK"
  nrun: 3
  passes: [1.0, 0.75, 0.50]
  covariables: ["dem", "lat", "lon"]
  interpolation:
    method: "barnes"
    maxdist: 2.0
    nmin: 4
    nmax: 12
