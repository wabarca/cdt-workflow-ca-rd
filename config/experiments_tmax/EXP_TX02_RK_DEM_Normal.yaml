# ==============================================================================
# EXPERIMENTO EXP-TX02: Gradiente Adiabático Ambiental Diurno (RK + DEM + Normal)
# ==============================================================================
# Justificación Física y Climatológica Regional:
# Modela el enfriamiento por ascenso adiabático (~ -6.5 °C/km) en Cordillera Central y Sierra Madre.
# ==============================================================================

include: "config/global_config.yaml"

experiment_id: "EXP_TX02_RK_DEM_Normal"
variable_type: "tmax"
var_id: "temp"
description: "Gradiente Adiabático Ambiental Diurno: RK con elevación DEM y QM Normal"

downscaling:
  method: "blin"

bias_correction:
  method: "qmdist"
  distribution: "norm"
  interpolation:
    method: "idw"
    maxdist: 3.5
    nmin: 4
    nmax: 12

merging:
  method: "RK"
  nrun: 3
  passes: [1.0, 0.75, 0.50]
  covariables: ["dem"]
  interpolation:
    method: "okr"
    maxdist: 3.5
    nmin: 4
    nmax: 12
    use_block: true
    variogram_models: ["Sph", "Exp", "Gau", "Pen"]
